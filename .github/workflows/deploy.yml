
name: Deploy FitLife Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modern-ui-react/package-lock.json

      - name: Install dependencies
        working-directory: modern-ui-react
        run: npm ci

      - name: Build React website
        working-directory: modern-ui-react
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: modern-ui-react/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
